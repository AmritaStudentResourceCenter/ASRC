<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Amrita Student Resource Center (ASRC)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================================================
           0. CSS VARIABLES & RESET
           ========================================================================== */
        :root {
            --bg-main: #FFFFFF;
            --primary: #2563EB;
            --secondary: #06B6D4;
            --accent: #7C3AED;
            --retro-pink: #EC4899;
            --text-dark: #111827;
            --text-muted: #4B5563;
            --bg-light: #F8FAFC;
            
            --font-head: 'Space Grotesk', sans-serif;
            --font-sub: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;

            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.8); 
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --neon-glow-blue: 0 0 15px rgba(37, 99, 235, 0.4);
            --neon-glow-pink: 0 0 15px rgba(236, 72, 153, 0.4);
            
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-dark);
            background-color: var(--bg-main);
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* Custom Cursor Glow */
        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15), rgba(124, 58, 237, 0.08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: transform 0.05s ease;
        }

        /* Typography Defaults */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-head);
            letter-spacing: -0.02em;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* Reusable Components */
        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, var(--text-dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
        }

        .section-title-wrap {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .section-subtitle {
            font-family: var(--font-sub);
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .retro-badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            font-family: var(--font-head);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(236, 72, 153, 0.1);
            color: var(--retro-pink);
            border: 1px solid rgba(236, 72, 153, 0.3);
            margin-bottom: 1rem;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.75rem;
            font-family: var(--font-head);
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-normal);
            position: relative;
            overflow: hidden;
            border: none;
            outline: none;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(124, 58, 237, 0.5);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-dark);
            border: 1px solid rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
        }

        /* Scroll Animation Target */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Page Loader */
        #loader {
            position: fixed;
            inset: 0;
            background: #FFFFFF;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(37, 99, 235, 0.1);
            border-left-color: var(--primary);
            border-top-color: var(--retro-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            margin-top: 1rem;
            font-family: var(--font-head);
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-dark);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==========================================================================
           1. NAVBAR
           ========================================================================== */
        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            transition: var(--transition-normal);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .navbar.scrolled {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.95);
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--text-dark);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--retro-pink));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            box-shadow: var(--neon-glow-blue);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            font-family: var(--font-sub);
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-muted);
            transition: var(--transition-fast);
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--retro-pink));
            transition: var(--transition-normal);
            border-radius: 2px;
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-icon-btn {
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: 1.1rem;
        }

        .nav-icon-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--primary);
        }

        .github-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--text-dark);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-family: var(--font-head);
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition-normal);
        }

        .github-btn:hover {
            background: #000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        /* Search Overlay */
        .search-overlay {
            position: fixed;
            inset: 0;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10vh;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-normal);
        }

        .search-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .search-box {
            width: 90%;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1.2rem 1.5rem 1.2rem 3.5rem;
            border-radius: 16px;
            border: 2px solid var(--primary);
            background: white;
            font-size: 1.2rem;
            font-family: var(--font-body);
            outline: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .search-icon-inside {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            color: var(--text-muted);
        }

        .close-search {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* ==========================================================================
           CONTINUE FROM ORIGINAL FILE - All sections intact
           ========================================================================== */
    </style>
</head>
